<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Sidecar">
  <defs>
    <linearGradient id="sidecar-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#1F5FD0"/>
    </linearGradient>
    <linearGradient id="sidecar-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset="1" stop-color="#3E8BE8"/>
    </linearGradient>
  </defs>

  <!-- main editor panel -->
  <rect x="18" y="24" width="62" height="80" rx="12" fill="url(#sidecar-main)"/>

  <!-- docked sidecar panel -->
  <rect x="56" y="40" width="54" height="48" rx="11" fill="url(#sidecar-side)"/>

  <!-- chat lines inside the sidecar -->
  <rect x="66" y="53" width="26" height="5" rx="2.5" fill="#0F3C8C" opacity="0.55"/>
  <rect x="66" y="64" width="34" height="5" rx="2.5" fill="#0F3C8C" opacity="0.4"/>
  <rect x="66" y="75" width="18" height="5" rx="2.5" fill="#0F3C8C" opacity="0.55"/>

  <!-- grounding link back to the main panel -->
  <path d="M50 84 L44 92" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="42" cy="95" r="4.5" fill="#FFFFFF"/>
</svg>